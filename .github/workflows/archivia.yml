name: Archivia una versione

# Ricompila una versione passata (dal suo codice) e la pubblica con il suo numero.
on:
  workflow_dispatch:
    inputs:
      ref:
        description: "Commit o tag da compilare"
        required: true
      versione:
        description: "Numero di versione (es. 1.3)"
        required: true

permissions:
  contents: write

jobs:
  archivia:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      - name: Compila
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon assembleDebug
          cp app/build/outputs/apk/debug/app-debug.apk SoloDM-${{ inputs.versione }}.apk

      - name: Pubblica versione numerata
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ inputs.versione }}
          target_commitish: ${{ inputs.ref }}
          name: Solo DM ${{ inputs.versione }}
          body: "Versione ${{ inputs.versione }}. Per tornare a questa versione: scarica SoloDM-${{ inputs.versione }}.apk e installala (se il telefono si lamenta, prima disinstalla la versione più nuova)."
          files: SoloDM-${{ inputs.versione }}.apk
          make_latest: false
