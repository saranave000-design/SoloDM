name: Archivia una versione

# Ricompila una versione passata (dal suo codice) e la pubblica con il suo numero.
# Si avvia quando cambia archivio.txt (righe: "versione commit").
on:
  push:
    branches: [main]
    paths: ["archivio.txt"]

permissions:
  contents: write

jobs:
  archivia:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Leggi l'ultima riga di archivio.txt
        run: |
          read VERSIONE REF < <(grep -v '^#' archivio.txt | grep . | tail -1)
          echo "VERSIONE=$VERSIONE" >> $GITHUB_ENV
          echo "REF=$REF" >> $GITHUB_ENV

      - uses: actions/checkout@v4
        with:
          ref: ${{ env.REF }}

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      - name: Compila
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon assembleDebug
          cp app/build/outputs/apk/debug/app-debug.apk SoloDM-${{ env.VERSIONE }}.apk

      - name: Pubblica versione numerata
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ env.VERSIONE }}
          target_commitish: ${{ env.REF }}
          name: Solo DM ${{ env.VERSIONE }}
          body: "Versione ${{ env.VERSIONE }}. Per tornare a questa versione: scarica SoloDM-${{ env.VERSIONE }}.apk e installala (se il telefono si lamenta, prima disinstalla la versione più nuova)."
          files: SoloDM-${{ env.VERSIONE }}.apk
          make_latest: false
