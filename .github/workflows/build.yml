name: Compila APK

on:
  push:
    branches: [main]
    paths-ignore:
      - "docs/**"
      - "**.md"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      - name: Compila
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon assembleDebug

      - name: Rinomina APK
        run: |
          VER=$(grep -oP 'versionName = "\K[^"]+' app/build.gradle.kts)
          echo "VER=$VER" >> $GITHUB_ENV
          cp app/build/outputs/apk/debug/app-debug.apk SoloDM.apk
          cp app/build/outputs/apk/debug/app-debug.apk SoloDM-$VER.apk

      - uses: actions/upload-artifact@v4
        with:
          name: SoloDM
          path: SoloDM.apk

      # Pubblica sempre l'ultima versione nella stessa pagina "Releases",
      # così dal telefono basta aprire il link e scaricare SoloDM.apk
      - name: Pubblica release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ultima
          name: Solo DM (ultima versione)
          body: "Versione compilata dal commit ${{ github.sha }}. Scarica SoloDM.apk e installalo sopra la versione precedente."
          files: SoloDM.apk
          make_latest: true
          prerelease: false

      # Paracadute: ogni versione resta scaricabile con il suo numero
      - name: Pubblica versione numerata
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ env.VER }}
          name: Solo DM ${{ env.VER }}
          body: "Versione ${{ env.VER }}. Per tornare a questa versione: scarica SoloDM-${{ env.VER }}.apk e installala (se il telefono si lamenta, prima disinstalla la versione più nuova)."
          files: SoloDM-${{ env.VER }}.apk
          make_latest: false
          prerelease: false
